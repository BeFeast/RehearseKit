name: Compose Check

on:
  pull_request:
    paths:
      - docker-compose.yml
      - config/.env.example
      - backend/Dockerfile
      - backend/requirements.txt
      - frontend/Dockerfile
      - frontend/.dockerignore
      - websocket/Dockerfile
      - scripts/smoke.sh
      - .github/workflows/compose-check.yml
  push:
    branches:
      - main
    paths:
      - docker-compose.yml
      - config/.env.example
      - backend/Dockerfile
      - backend/requirements.txt
      - frontend/Dockerfile
      - frontend/.dockerignore
      - websocket/Dockerfile
      - scripts/smoke.sh
      - .github/workflows/compose-check.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp config/.env.example .env
          docker compose config --quiet

      - name: Validate smoke script syntax
        run: bash -n scripts/smoke.sh
