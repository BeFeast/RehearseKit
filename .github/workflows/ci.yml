name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      JWT_SECRET_KEY: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # A pinned version is downloaded directly; "latest" asks the GitHub
          # API anonymously and hits its rate limit from this runner.
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/requirements-ci.txt

      - name: Install test dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -r requirements-ci.txt

      - name: Run pytest
        run: .venv/bin/pytest tests

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Build frontend
        run: bun run build

  go-tests:
    name: Go vet and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      - name: Vet
        run: go vet ./...

      # Database, ffmpeg and xmllint checks skip when those are missing.
      - name: Test
        run: go test ./...

      # Runner image guards (#35): manifest pinning/verification and the egress lock.
      - name: Runner weights and egress tests
        run: python3 -m unittest deploy/gpu-runner/test_fetch_models.py tools/egress/test_egress.py

  web-checks:
    name: Web typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Includes the grid parity test against internal/pipeline/grid/testdata.
      - name: Test
        run: bun run test
